<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo-header">
        <img src="../icons/settings.png" alt="Logo" />
        <span class="title">Settings</span>
      </div>

      <h3>Export Format</h3>
      <label><input type="radio" name="exportFormat" value="txt" /> Txt</label><br />
      <label><input type="radio" name="exportFormat" value="csv" /> CSV</label><br />
      <label><input type="radio" name="exportFormat" value="md" /> Markdown</label>

      <h3>上傳方式</h3>
      <label><input type="radio" name="uploadMethod" value="none" /> 不上傳</label><br />
      <label><input type="radio" name="uploadMethod" value="drive" /> Google Drive</label><br />
      <label><input type="radio" name="uploadMethod" value="sheets" /> Google Sheets</label>

      <div id="sheetIdRow" class="sheet-id-row">
        <label for="sheetId">Google Sheets ID</label>
        <input type="text" id="sheetId" placeholder="試算表網址中 /d/ 與 /edit 之間的字串" />
      </div>

      <h3>自動上傳</h3>
      <label><input type="checkbox" id="autoUpload" /> 定期自動上傳目前所有分頁</label>
      <div id="autoUploadIntervalRow" class="sheet-id-row">
        <label for="autoUploadInterval">間隔時間</label>
        <select id="autoUploadInterval">
          <option value="15">15 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="60">60 分鐘</option>
          <option value="180">180 分鐘</option>
        </select>
      </div>
      <p class="hint">需先在上方選擇「Google Drive」或「Google Sheets」作為上傳方式才會生效。</p>

      <h3>Google 帳號</h3>
      <div class="button-row">
        <button id="googleLogin">登入 Google</button>
        <button id="googleLogout">登出 Google</button>
      </div>
      <p id="authStatus" class="status"></p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
